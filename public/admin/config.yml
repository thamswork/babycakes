backend:
  name: github
  repo: thamswork/babycakes
  branch: main

publish_mode: editorial_workflow

media_library:
  name: cloudinary
  config:
    cloud_name: YOUR_CLOUDINARY_CLOUD_NAME
    api_key: YOUR_CLOUDINARY_API_KEY
    default_transformations:
      - - width: 800
          quality: auto
          fetch_format: auto

site_url: https://babycakes.pages.dev
display_url: https://babycakes.pages.dev

collections:

  # ── BI-WEEKLY FLAVOR DROPS ──────────────────────────────────────
  - name: "weekly_updates"
    label: "Bi-Weekly Flavors"
    label_singular: "Flavor Drop"
    description: "Add and manage bi-weekly flavor drops. Each post appears on the Bi-Weekly Flavors page."
    folder: "src/content/weekly-updates"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "/bi-weekly/{{slug}}"
    sortable_fields: ["date", "name"]
    fields:
      - label: "Flavor Name"
        name: "name"
        widget: "string"
        hint: "E.g. Strawberry Kiss, Dubai Chocolate"

      - label: "URL Slug"
        name: "slug"
        widget: "string"
        hint: "URL-friendly name e.g. strawberry-kiss"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "Campaign Period"
        name: "period"
        widget: "string"
        hint: "E.g. 17 Feb – 13 March"

      - label: "Availability Tag"
        name: "tag"
        widget: "select"
        options:
          - { label: "Bi-Weekly", value: "bi-weekly" }
          - { label: "Limited",   value: "limited" }
          - { label: "New Drop",  value: "new-drop" }
        default: "bi-weekly"

      - label: "Card Background Color"
        name: "bg"
        widget: "string"
        default: "#4C4378"
        hint: "Hex color for the card background e.g. #8a3a46"

      - label: "Hero Image"
        name: "hero_image"
        widget: "image"
        required: false
        hint: "Product photo — will be served at w_800,q_auto,f_auto"

      - label: "Short Description"
        name: "desc"
        widget: "text"
        hint: "1–2 sentences shown on the card. Keep it punchy."

      - label: "Full Body"
        name: "body"
        widget: "markdown"
        hint: "Full flavor story shown on the detail page."

      - label: "Price (THB)"
        name: "price"
        widget: "number"
        required: false
        value_type: "float"
        hint: "E.g. 259"

      - label: "Featured?"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Pin to top of the page."

      - label: "Draft?"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - label: "Meta Title"
            name: "meta_title"
            widget: "string"
            required: false
            hint: "Max 60 chars. Defaults to Flavor Name | Babycakes"
          - label: "Meta Description"
            name: "meta_description"
            widget: "text"
            required: false
            hint: "Max 160 chars."

  # ── ALWAYS AVAILABLE PRODUCTS ────────────────────────────────────
  - name: "always_available"
    label: "Always Available"
    label_singular: "Product"
    description: "Manage permanent menu items. Subcategory is used to group products on the page."
    folder: "src/content/always-available"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["name", "category", "price"]
    fields:
      - label: "Product Name"
        name: "name"
        widget: "string"

      - label: "Subcategory"
        name: "category"
        widget: "select"
        options:
          - { label: "Tray Cakes",       value: "tray-cakes" }
          - { label: "Special Cakes",    value: "special-cakes" }
          - { label: "Cookies & Bites",  value: "cookies-bites" }

      - label: "Price"
        name: "price"
        widget: "string"
        hint: "E.g. from ฿160 or ฿259"

      - label: "Card Background Color"
        name: "bg"
        widget: "string"
        default: "#1e0c06"
        hint: "Hex color e.g. #1e0c06"

      - label: "Product Image"
        name: "image"
        widget: "image"
        required: false

      - label: "Short Description"
        name: "desc"
        widget: "text"
        hint: "1–2 sentences for the product card."

      - label: "Full Description"
        name: "body"
        widget: "markdown"
        required: false

      - label: "Available?"
        name: "available"
        widget: "boolean"
        default: true

  # ── LOCATIONS ────────────────────────────────────────────────────
  - name: "locations"
    label: "Locations"
    label_singular: "Branch"
    description: "Manage branch details, hours, and Grab links."
    folder: "src/content/locations"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Branch Name", name: "name",    widget: "string" }
      - { label: "Zone / Area", name: "zone",    widget: "string", hint: "E.g. Sukhumvit, Siam, Bangna" }
      - { label: "Address",     name: "addr",    widget: "text" }
      - { label: "Hours",       name: "hours",   widget: "string", hint: "E.g. 10:00 – 22:00" }
      - { label: "Transit",     name: "transit", widget: "string", hint: "E.g. BTS Siam" }
      - { label: "Grab Link",   name: "grab",    widget: "string", hint: "Full Grab delivery URL" }
      - { label: "Google Maps", name: "maps",    widget: "string", hint: "Full Google Maps URL" }
      - { label: "Headquarters?", name: "hq",   widget: "boolean", default: false }
      - { label: "Active?",     name: "active",  widget: "boolean", default: true }

  # ── CAREERS ──────────────────────────────────────────────────────
  - name: "careers"
    label: "Careers"
    label_singular: "Role"
    description: "Manage open job listings."
    folder: "src/content/careers"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Job Title",   name: "title", widget: "string" }
      - { label: "Department",  name: "dept",  widget: "select", options: ["Kitchen","Marketing","Creative","Ops","Service","Logistics","Other"] }
      - { label: "Type",        name: "type",  widget: "select", options: ["Full-time","Part-time","Contract","Internship"] }
      - { label: "Location",    name: "loc",   widget: "string", default: "Bangkok, TH" }
      - { label: "Description", name: "desc",  widget: "text" }
      - { label: "Open?",       name: "open",  widget: "boolean", default: true }

  # ── SITE SETTINGS ────────────────────────────────────────────────
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Global SEO"
        name: "seo"
        file: "src/content/settings/seo.json"
        fields:
          - { label: "Default Title Suffix", name: "title_suffix",        widget: "string", default: " | Babycakes" }
          - { label: "Default Description",  name: "default_description", widget: "text" }
          - { label: "Default OG Image",     name: "og_image",            widget: "image", required: false }

      - label: "Social & Order Links"
        name: "social"
        file: "src/content/settings/social.json"
        fields:
          - { label: "Instagram URL", name: "instagram", widget: "string" }
          - { label: "Facebook URL",  name: "facebook",  widget: "string" }
          - { label: "LINE OA Link",  name: "line",      widget: "string" }
          - { label: "TikTok URL",    name: "tiktok",    widget: "string" }
          - { label: "Grab Link",     name: "grab",      widget: "string" }
          - { label: "Linktree URL",  name: "linktree",  widget: "string" }
