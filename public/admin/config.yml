backend:
  name: github
  repo: thamswork/babycakes
  branch: main

publish_mode: editorial_workflow
site_url: https://babycakes.pages.dev
display_url: https://babycakes.pages.dev

collections:

  # SITE SETTINGS — LINE links, social, etc.
  - name: settings
    label: Site Settings
    files:
      - label: Order Links
        name: order_links
        file: src/content/settings/order-links.json
        fields:
          - { label: "Main Order LINE link", name: line_main,   widget: string, hint: "Primary LINE OA deep link for cake orders e.g. https://line.me/R/ti/p/@babycakes" }
          - { label: "Collab LINE link",      name: line_collab, widget: string, hint: "Separate LINE OA for partnership/collab enquiries" }
          - { label: "Grab delivery link",    name: grab,        widget: string }
          - { label: "LINE MAN link",         name: lineman,     widget: string }
          - { label: "Linktree / all links",  name: linktree,    widget: string }

      - label: Social Links
        name: social
        file: src/content/settings/social.json
        fields:
          - { label: Instagram, name: instagram, widget: string }
          - { label: Facebook,  name: facebook,  widget: string }
          - { label: TikTok,    name: tiktok,    widget: string }

  # BI-WEEKLY FLAVOR DROPS
  - name: weekly_updates
    label: Bi-Weekly Flavors
    label_singular: Flavor Drop
    folder: src/content/weekly-updates
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: /bi-weekly/{{slug}}
    fields:
      - { label: "Flavor Name",        name: name,     widget: string }
      - { label: "Campaign Period",    name: period,   widget: string, hint: "e.g. 17 Feb – 13 March" }
      - { label: "Availability",       name: tag,      widget: select, options: ["bi-weekly","limited","new-drop","collab"], default: bi-weekly }
      - { label: "Publish Date",       name: date,     widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: "Hero Image",         name: image,    widget: image,  required: false }
      - { label: "Card Background",    name: bg,       widget: string, default: "#4C4378", hint: "Hex color shown until photo is uploaded" }
      - { label: "Short Description",  name: desc,     widget: text }
      - { label: "Price",              name: price,    widget: number, required: false, value_type: float }
      - { label: "Featured?",          name: featured, widget: boolean, default: false }
      - { label: "Draft?",             name: draft,    widget: boolean, default: false }
      - { label: "Full Story",         name: body,     widget: markdown }
      - label: SEO
        name: seo
        widget: object
        collapsed: true
        fields:
          - { label: Meta Title,       name: meta_title,       widget: string, required: false }
          - { label: Meta Description, name: meta_description, widget: text,   required: false }

  # ALWAYS AVAILABLE — with subcategory
  - name: always_available
    label: Always Available
    label_singular: Product
    folder: src/content/always-available
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Name",   name: name,      widget: string }
      - { label: "Subcategory",    name: category,  widget: select, options: [{label: "Tray Cakes", value: tray-cakes},{label: "Special Cakes", value: special-cakes},{label: "Cookies & Bites", value: cookies-bites}] }
      - { label: "Price",          name: price,     widget: string, hint: "e.g. from ฿160" }
      - { label: "Product Image",  name: image,     widget: image,  required: false }
      - { label: "Card Background",name: bg,        widget: string, default: "#1e0c06" }
      - { label: "Description",    name: desc,      widget: text }
      - { label: "Available?",     name: available, widget: boolean, default: true }

  # LOCATIONS
  - name: locations
    label: Locations
    label_singular: Branch
    folder: src/content/locations
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Branch Name", name: name,    widget: string }
      - { label: "Zone",        name: zone,    widget: string }
      - { label: "Address",     name: addr,    widget: text }
      - { label: "Hours",       name: hours,   widget: string }
      - { label: "Transit",     name: transit, widget: string }
      - { label: "Grab Link",   name: grab,    widget: string }
      - { label: "Maps Link",   name: maps,    widget: string }
      - { label: "HQ?",         name: hq,      widget: boolean, default: false }
      - { label: "Active?",     name: active,  widget: boolean, default: true }

  # COLLABS
  - name: collabs
    label: Collaborations
    label_singular: Collab
    folder: src/content/collabs
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Partner Name",  name: name,  widget: string }
      - { label: "Type",          name: type,  widget: select, options: ["Product collab","Pop-up partner","Delivery partner","Sourcing partner","Brand collab","Other"] }
      - { label: "Logo",          name: logo,  widget: image,  required: false }
      - { label: "Description",   name: desc,  widget: text }
      - { label: "LINE link",     name: line,  widget: string, required: false, hint: "Use the collab LINE OA link from Site Settings" }
      - { label: "Website",       name: url,   widget: string, required: false }
      - { label: "Active?",       name: active,widget: boolean, default: true }

  # CAREERS
  - name: careers
    label: Careers
    label_singular: Role
    folder: src/content/careers
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Job Title",   name: title, widget: string }
      - { label: "Department",  name: dept,  widget: select, options: [Kitchen,Marketing,Creative,Ops,Service,Logistics,Other] }
      - { label: "Type",        name: type,  widget: select, options: [Full-time,Part-time,Contract,Internship] }
      - { label: "Location",    name: loc,   widget: string, default: "Bangkok, TH" }
      - { label: "Description", name: desc,  widget: text }
      - { label: "Open?",       name: open,  widget: boolean, default: true }
