backend:
  name: github
  repo: thamswork/babycakes
  branch: main
  base_url: https://babycakes-cms-oauth.tyme-sak.workers.dev
  auth_endpoint: /api/auth

publish_mode: editorial_workflow
media_folder: "public/photos"
public_folder: "/photos"
site_url: https://babycakes.pages.dev

collections:

  - name: settings
    label: "Site Settings"
    files:
      - label: "Order Links"
        name: order_links
        file: "src/content/settings/order-links.json"
        fields:
          - { label: "Main Order LINE link",      name: line_main,   widget: string }
          - { label: "Collab / Partnership LINE", name: line_collab, widget: string }
          - { label: "GrabFood link",             name: grab,        widget: string }
          - { label: "LINE MAN link",             name: lineman,     widget: string }
          - { label: "Linktree",                  name: linktree,    widget: string, required: false }

      - label: "Social Links"
        name: social
        file: "src/content/settings/social.json"
        fields:
          - { label: Instagram, name: instagram, widget: string }
          - { label: Facebook,  name: facebook,  widget: string }
          - { label: TikTok,    name: tiktok,    widget: string }
          - { label: LINE,      name: line,      widget: string }

      - label: "Brand Photos"
        name: brand_photos
        file: "src/content/settings/brand-photos.json"
        fields:
          - { label: "Hero / Homepage photo",    name: hero_photo,  widget: image, required: false }
          - { label: "Founder Nile portrait",    name: nile_photo,  widget: image, required: false }
          - { label: "Founder Tess portrait",    name: tess_photo,  widget: image, required: false }
          - { label: "First pop-up photo 2022",  name: popup_photo, widget: image, required: false }
          - { label: "Timeline 2021",            name: tl_2021,     widget: image, required: false }
          - { label: "Timeline 2022",            name: tl_2022,     widget: image, required: false }
          - { label: "Timeline 2023",            name: tl_2023,     widget: image, required: false }
          - { label: "Timeline 2024",            name: tl_2024,     widget: image, required: false }
          - { label: "Timeline 2025",            name: tl_2025,     widget: image, required: false }

  - name: weekly_updates
    label: "Bi-Weekly Flavors"
    label_singular: "Flavor Drop"
    folder: "src/content/weekly-updates"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    fields:
      - { label: "Flavor Name",       name: name,     widget: string }
      - { label: "URL Slug",          name: slug,     widget: string, hint: "e.g. strawberry-kiss" }
      - { label: "Publish Date",      name: date,     widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Campaign Period",   name: period,   widget: string, hint: "e.g. 17 Feb – 13 March" }
      - { label: "Tag",               name: tag,      widget: select, options: ["bi-weekly", "limited", "new-drop", "collab"] }
      - { label: "Photo",             name: image,    widget: image, required: false }
      - { label: "Card BG Color",     name: bg,       widget: string, default: "#4C4378" }
      - { label: "Short Description", name: desc,     widget: text }
      - { label: "Price (THB)",       name: price,    widget: number, required: false, value_type: float }
      - { label: "Featured?",         name: featured, widget: boolean, default: false }
      - { label: "Draft?",            name: draft,    widget: boolean, default: false }
      - { label: "Full Story",        name: body,     widget: markdown, required: false }

  - name: always_available
    label: "Always Available"
    label_singular: "Product"
    folder: "src/content/always-available"
    create: true
    slug: "{{fields.slug}}"
    fields:
      - { label: "Product Name", name: name,      widget: string }
      - { label: "Slug",         name: slug,      widget: string }
      - { label: "Subcategory",  name: category,  widget: select, options: ["Tray Cakes", "Special Cakes", "Cookies & Bites"] }
      - { label: "Price",        name: price,     widget: string, hint: "e.g. from ฿160" }
      - { label: "Photo",        name: image,     widget: image, required: false }
      - { label: "Card BG",      name: bg,        widget: string, default: "#1e0c06" }
      - { label: "Description",  name: desc,      widget: text }
      - { label: "Available?",   name: available, widget: boolean, default: true }

  - name: locations
    label: "Locations"
    label_singular: "Branch"
    folder: "src/content/locations"
    create: true
    slug: "{{fields.slug}}"
    fields:
      - { label: "Branch Name",  name: name,    widget: string }
      - { label: "Slug",         name: slug,    widget: string }
      - { label: "Zone / Area",  name: zone,    widget: string }
      - { label: "Address",      name: addr,    widget: text }
      - { label: "Hours",        name: hours,   widget: string }
      - { label: "Transit",      name: transit, widget: string }
      - { label: "Grab Link",    name: grab,    widget: string }
      - { label: "Google Maps",  name: maps,    widget: string }
      - { label: "Branch Photo", name: image,   widget: image, required: false }
      - { label: "HQ?",          name: hq,      widget: boolean, default: false }
      - { label: "Active?",      name: active,  widget: boolean, default: true }

  - name: collabs
    label: "Collaborations"
    label_singular: "Collab"
    folder: "src/content/collabs"
    create: true
    slug: "{{fields.slug}}"
    fields:
      - { label: "Partner Name", name: name,   widget: string }
      - { label: "Slug",         name: slug,   widget: string }
      - { label: "Type",         name: type,   widget: select, options: ["Product collab", "Pop-up partner", "Delivery partner", "Sourcing partner", "Brand collab", "Other"] }
      - { label: "Description",  name: desc,   widget: text }
      - { label: "Logo",         name: logo,   widget: image, required: false }
      - { label: "Collab LINE",  name: line,   widget: string, required: false }
      - { label: "Website",      name: url,    widget: string, required: false }
      - { label: "Active?",      name: active, widget: boolean, default: true }

  - name: careers
    label: "Careers"
    label_singular: "Role"
    description: "Job listings shown on the Careers page. All fields appear in the popup modal."
    folder: "src/content/careers"
    create: true
    slug: "{{fields.slug}}"
    extension: json
    format: json
    fields:
      - { label: "Job Title",          name: title,        widget: string }
      - { label: "Slug",               name: slug,         widget: string, hint: "URL-safe e.g. pastry-chef" }
      - { label: "Department",         name: dept,         widget: select, options: ["Kitchen", "Marketing", "Creative", "Ops", "Service", "Logistics", "Other"] }
      - { label: "Employment Type",    name: type,         widget: select, options: ["Full-time", "Part-time", "Contract", "Internship"] }
      - { label: "Location",           name: loc,          widget: string, default: "Bangkok, TH" }
      - { label: "Salary Min (THB)",   name: salary_min,   widget: number, required: false, hint: "e.g. 25000" }
      - { label: "Salary Max (THB)",   name: salary_max,   widget: number, required: false, hint: "e.g. 40000" }
      - { label: "Salary Note",        name: salary_note,  widget: string, required: false, hint: "e.g. THB/month depending on experience" }
      - { label: "Ideal Start Date",   name: start_date,   widget: string, required: false, hint: "e.g. June 2026 or Immediate" }
      - { label: "Short Description",  name: desc,         widget: text,   hint: "One line shown on the job listing card" }
      - { label: "Responsibilities",   name: responsibilities, widget: text, required: false, hint: "What they will do day-to-day (shown in popup)" }
      - { label: "Requirements",       name: requirements, widget: text,   required: false, hint: "Skills and experience needed (shown in popup)" }
      - { label: "Benefits",           name: benefits,     widget: string, required: false, hint: "Perks for this role" }
      - { label: "Open?",              name: open,         widget: boolean, default: true }

  # ── BRAND PAGE CONTENT ────────────────────────────────────────────────
  - name: brand_hero
    label: "Brand Page — Hero"
    description: "Edit the hero section stats and headline on the Brand page"
    files:
      - label: "Hero Content"
        name: hero
        file: "src/content/brand/hero.json"
        fields:
          - { label: "Tagline (small tag)",    name: tagline,       widget: string }
          - { label: "Headline line 1",        name: headline_1,    widget: string }
          - { label: "Headline line 2",        name: headline_2,    widget: string }
          - { label: "Subheading",             name: subheading,    widget: text }
          - { label: "Stat 1 Value",           name: stat_1_value,  widget: string, hint: "e.g. 2021" }
          - { label: "Stat 1 Label",           name: stat_1_label,  widget: string, hint: "e.g. Founded" }
          - { label: "Stat 2 Value",           name: stat_2_value,  widget: string }
          - { label: "Stat 2 Label",           name: stat_2_label,  widget: string }
          - { label: "Stat 3 Value",           name: stat_3_value,  widget: string }
          - { label: "Stat 3 Label",           name: stat_3_label,  widget: string }
          - { label: "Stat 4 Value",           name: stat_4_value,  widget: string }
          - { label: "Stat 4 Label",           name: stat_4_label,  widget: string }

  - name: brand_story
    label: "Brand Page — Story Section"
    description: "Edit the story text, stats, and pop-up photo caption"
    files:
      - label: "Story Content"
        name: story
        file: "src/content/brand/story.json"
        fields:
          - { label: "Section Headline",    name: headline,       widget: string }
          - { label: "Body paragraph 1",    name: body_1,         widget: text }
          - { label: "Body paragraph 2",    name: body_2,         widget: text }
          - label: "First pop-up photo"
            name: popup_photo
            widget: image
            required: false
            hint: "Photo of the first pop-up at Refill Coffee, 2022"
          - { label: "Pop-up year",         name: popup_year,     widget: string, default: "2022" }
          - { label: "Pop-up caption",      name: popup_caption,  widget: string }
          - { label: "Stat 1 Value",        name: stat_price,     widget: string, hint: "e.g. ฿210" }
          - { label: "Stat 1 Label",        name: stat_price_label,widget: string }
          - { label: "Stat 2 Value",        name: stat_locations, widget: string }
          - { label: "Stat 2 Label",        name: stat_locations_label, widget: string }
          - { label: "Stat 3 Value",        name: stat_rhythm,    widget: string }
          - { label: "Stat 3 Label",        name: stat_rhythm_label, widget: string }

  - name: brand_founders
    label: "Brand Page — Founders"
    description: "Edit Nile and Tess founder profiles, bios, and photos"
    files:
      - label: "Founder — Nile"
        name: founder_nile
        file: "src/content/brand/founder-nile.json"
        fields:
          - { label: "Display order",   name: order,      widget: number, default: 1 }
          - { label: "Nickname",        name: nickname,   widget: string }
          - { label: "Full Name",       name: full_name,  widget: string }
          - { label: "Role title",      name: role,       widget: string }
          - label: "Portrait photo"
            name: photo
            widget: image
            required: false
            hint: "Founder portrait — tall format works best"
          - { label: "Photo BG color",  name: bg_color,   widget: string, default: "#2a1640" }
          - { label: "Bio paragraph 1", name: bio_1,      widget: text }
          - { label: "Bio paragraph 2", name: bio_2,      widget: text, required: false }
          - { label: "Stat 1 Value",    name: stat_1_value, widget: string }
          - { label: "Stat 1 Label",    name: stat_1_label, widget: string }
          - { label: "Stat 2 Value",    name: stat_2_value, widget: string }
          - { label: "Stat 2 Label",    name: stat_2_label, widget: string }
          - { label: "Stat 3 Value",    name: stat_3_value, widget: string }
          - { label: "Stat 3 Label",    name: stat_3_label, widget: string }

      - label: "Founder — Tess"
        name: founder_tess
        file: "src/content/brand/founder-tess.json"
        fields:
          - { label: "Display order",   name: order,      widget: number, default: 2 }
          - { label: "Nickname",        name: nickname,   widget: string }
          - { label: "Full Name",       name: full_name,  widget: string }
          - { label: "Role title",      name: role,       widget: string }
          - label: "Portrait photo"
            name: photo
            widget: image
            required: false
            hint: "Founder portrait — tall format works best"
          - { label: "Photo BG color",  name: bg_color,   widget: string, default: "#101828" }
          - { label: "Bio paragraph 1", name: bio_1,      widget: text }
          - { label: "Bio paragraph 2", name: bio_2,      widget: text, required: false }
          - { label: "Stat 1 Value",    name: stat_1_value, widget: string }
          - { label: "Stat 1 Label",    name: stat_1_label, widget: string }
          - { label: "Stat 2 Value",    name: stat_2_value, widget: string }
          - { label: "Stat 2 Label",    name: stat_2_label, widget: string }
          - { label: "Stat 3 Value",    name: stat_3_value, widget: string }
          - { label: "Stat 3 Label",    name: stat_3_label, widget: string }

  - name: brand_timeline
    label: "Brand Page — Timeline"
    description: "Edit the company journey timeline events and photos"
    files:
      - label: "Timeline"
        name: timeline
        file: "src/content/brand/timeline.json"
        fields:
          - label: "Timeline Events"
            name: items
            widget: list
            fields:
              - { label: "Year",        name: year,  widget: string }
              - { label: "Event title", name: event, widget: string }
              - { label: "Description", name: desc,  widget: text }
              - label: "Photo"
                name: photo
                widget: image
                required: false
                hint: "Photo for this milestone year"
